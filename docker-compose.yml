services:
  # Optional: local PostgreSQL for development without Supabase.
  # Set DATABASE_URL=postgresql://onereport:onereport@localhost:5432/onereport
  # in frontend/.env, then run: docker compose up postgres
  postgres:
    image: postgres:16-alpine
    container_name: onereport-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onereport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onereport}
      POSTGRES_DB: ${POSTGRES_DB:-onereport}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onereport} -d ${POSTGRES_DB:-onereport}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional MinIO for local S3 storage. Start with:
  #   docker compose --profile s3 up minio
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: onereport-minio
    profiles: ["s3"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
